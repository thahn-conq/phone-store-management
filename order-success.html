<!DOCTYPE html>

  <script>/* đặt giao diện sáng/tối trước khi vẽ trang để không bị nháy màu */
    (function () { try { var t = JSON.parse(localStorage.getItem("theme")); if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; document.documentElement.dataset.theme = t; } catch (e) {} })();
  </script>

  <link rel="stylesheet" href="css/order.css">
</head>

  <main class="main">
    <div class="container ord-success-wrap">
      <section class="card ord-success-card" id="ord-success"></section>
    </div>
  </main>
  <div id="site-footer"></div>

</html>
