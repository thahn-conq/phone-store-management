<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - GreenPhone</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/account.css">
</head>

<body>
    <main class="forgot-page">
        <section class="forgot-card">
            <a href="index.html" class="forgot-logo"><span class="gp-leaf-mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M19.5 4.5C12 4.4 6.1 6.4 5 12.1c-.6 3.1 1.5 5.3 4.3 5.1 5.8-.4 8.1-6.7 10.2-12.7Z"/><path d="M4 20c3.5-5.2 7.2-8.3 12.2-11.2"/></svg></span><span>GreenPhone</span></a>

            <h1>Quên mật khẩu</h1>
            <p>
                Nhập số điện thoại và email đã đăng ký để đặt lại mật khẩu.
            </p>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="forgotPhone">Số điện thoại</label>
                    <input
                        type="tel"
                        id="forgotPhone"
                        class="input"
                        placeholder="Nhập số điện thoại đã đăng ký"
                        maxlength="10"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="forgotEmail">Email</label>
                    <input
                        type="email"
                        id="forgotEmail"
                        class="input"
                        placeholder="Nhập email đã đăng ký"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="forgotNewPassword">Mật khẩu mới</label>
                    <div class="password-box">
                        <input
                            type="password"
                            id="forgotNewPassword"
                            class="input"
                            minlength="6"
                            placeholder="Nhập mật khẩu mới"
                            required
                        >
                        <button
                            type="button"
                            data-forgot-password-target="forgotNewPassword"
                            aria-label="Hiện mật khẩu"
                        >👁</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="forgotConfirmPassword">Nhập lại mật khẩu mới</label>
                    <div class="password-box">
                        <input
                            type="password"
                            id="forgotConfirmPassword"
                            class="input"
                            minlength="6"
                            placeholder="Nhập lại mật khẩu mới"
                            required
                        >
                        <button
                            type="button"
                            data-forgot-password-target="forgotConfirmPassword"
                            aria-label="Hiện mật khẩu"
                        >👁</button>
                    </div>
                </div>

                <div class="forgot-actions">
                    <a href="login.html" class="forgot-btn forgot-btn-back">
                        ← Quay lại đăng nhập
                    </a>
                    <button type="submit" class="forgot-btn forgot-btn-primary">
                        Đặt lại mật khẩu
                    </button>
                </div>

                <p id="forgotMessage" class="forgot-message" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="js/account.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
